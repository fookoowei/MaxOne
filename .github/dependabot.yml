version: 2
updates:
  # Backend npm dependencies
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Frontend npm dependencies
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Keep the GitHub Actions themselves up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
