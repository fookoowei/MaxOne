name: CI

# Runs on pushes to main (which then deploy) and on PRs targeting main (checks only).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — type-check + unit + integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # M17: the integration lane runs here too, against throwaway service containers. On a GitHub
    # runner these ARE reachable on localhost — the one place that hostname is legitimate.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: wallet
          POSTGRES_DB: wallet_db_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wallet -d wallet_db_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      rabbitmq:
        image: rabbitmq:4-management
        ports: ["5672:5672", "15672:15672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://wallet:wallet@localhost:5432/wallet_db_test
      TEST_REDIS_URL: redis://localhost:6379/1
      TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672/test
      RABBITMQ_MANAGEMENT_URL: http://localhost:15672
      # Required by the app at boot (no fallbacks since M17); the lane overrides the URLs above.
      REDIS_URL: redis://localhost:6379/1
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/test
      JWT_ACCESS_SECRET: ci-access
      JWT_REFRESH_SECRET: ci-refresh
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_NAME: MaxOne
      WEBAUTHN_ORIGIN: http://localhost:3300
      VAPID_PUBLIC_KEY: BNcRdreALRFXTkOOUHK1EtK2wtaz5Ry4YfYCA_KKKcRqHlpxWDT8mY3FQHrDf6h8jMc1E9pCiAxRLOLSf0w_lZE
      VAPID_PRIVATE_KEY: tBHItJI5svbpez7KI4CCXg
      VAPID_SUBJECT: mailto:ci@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:integration:ci

  frontend:
    name: Frontend — type-check + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  customer:
    name: Customer — type-check + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: customer/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  # The gate: only runs on a push to main, and only AFTER all check jobs pass
  # (`needs`). If a test fails, this job is skipped → nothing deploys.
  deploy:
    name: Deploy — main only, gated on green
    needs: [backend, frontend, customer]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Each hook fires only if its secret is set — so you can gate just the
      # backend, or both, without the workflow erroring on a missing secret.
      - name: Trigger Render deploy (backend)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        if: env.HOOK != ''
        run: curl -fsSL -X POST "$HOOK"
      - name: Trigger Vercel deploy (frontend)
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        if: env.HOOK != ''
        run: curl -fsSL -X POST "$HOOK"
      - name: Trigger Vercel deploy (customer app)
        env:
          HOOK: ${{ secrets.VERCEL_CUSTOMER_DEPLOY_HOOK }}
        if: env.HOOK != ''
        run: curl -fsSL -X POST "$HOOK"
