# Render Blueprint (M17). Apply once from the Render dashboard: New → Blueprint → this repo.
# Two services from ONE Docker image: the API (web, has a port) and the queue worker (no port).
# Every secret is `sync: false` = you paste it in the dashboard; nothing sensitive lives in git.
# Managed dependencies live elsewhere: Postgres = Neon, Redis = Upstash, RabbitMQ = CloudAMQP
# (see DEPLOY.md for the env-var matrix and the exact URL formats — no localhost anywhere).
services:
  - type: web
    name: maxone-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health          # 503 only when Postgres is down → Render replaces the instance
    autoDeploy: false                 # CI triggers the deploy hook only after tests pass (ci.yml)
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3100"
      - key: LOG_LEVEL
        value: info
      - key: SERVICE_NAME
        value: api
      - key: CONSUMER_IN_PROCESS
        value: "true"                 # free tier: run the queue consumer inside the API (see DEPLOY.md §2)
      - key: DATABASE_URL
        sync: false                   # Neon connection string (pooled is fine for the API)
      - key: REDIS_URL
        sync: false                   # Upstash: rediss://default:<token>@<host>:6379/0
      - key: RABBITMQ_URL
        sync: false                   # CloudAMQP: amqps://<user>:<pass>@<host>/<user>
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false                   # mailto:you@example.com
      - key: WEBAUTHN_RP_ID
        sync: false                   # customer app hostname, e.g. maxone-customer.vercel.app
      - key: WEBAUTHN_RP_NAME
        value: MaxOne
      - key: WEBAUTHN_ORIGIN
        sync: false                   # https://maxone-customer.vercel.app
      - key: FRONTEND_ORIGIN
        sync: false                   # same customer origin (CORS for the browser WebSocket)
      - key: SENTRY_DSN
        sync: false                   # optional — leave empty to disable
      - key: COINGECKO_API_KEY
        sync: false                   # optional — free Demo key; keyless = shared-IP rate limit (Markets goes empty)

  # OPTIONAL — the separate worker. Render background workers are NOT on the free tier (Starter,
  # ~$7/mo). If you enable this, set CONSUMER_IN_PROCESS=false on the API so pushes aren't consumed
  # twice. Uncomment to use.
