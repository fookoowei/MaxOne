services:
  db:
    image: postgres:16
    container_name: wallet_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - wallet_pgdata:/var/lib/postgresql/data
    healthcheck:
      # "is Postgres actually accepting connections?" — dependents wait on this
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # M16a: cache-aside store for external public data (markets/FX). The app is fail-soft
    # without it — Redis is an optimisation, never a dependency.
    image: redis:7-alpine
    container_name: wallet_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    # M16b: message broker for work handed off the HTTP request (first consumer: Web Push).
    # Unlike Redis this GETS a volume — a queued message is work, not a copy of anything.
    image: rabbitmq:4-management
    container_name: wallet_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP (the app)
      - "15672:15672" # management UI (http://localhost:15672, guest/guest)
    volumes:
      - wallet_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: wallet_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Everything from the root .env (VAPID_*, JWT_*, …); explicit entries below override it with
    # in-network hosts (compose service names via Docker DNS, not localhost).
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 3100
      NODE_ENV: production
      FRONTEND_ORIGIN: http://localhost:3200
    ports:
      - "3100:3100"
    healthcheck:
      # Node 22 ships global fetch, so no curl/wget needed in the slim image
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    # M16b: the consumer. Same image as the API, different entrypoint, no port. Needs the broker
    # (fail-fast) and the DB (push subscriptions). Scale with `docker compose up -d --scale worker=3`
    # (drop container_name first).
    build: ./backend
    container_name: wallet_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      NODE_ENV: production
    command: ["node", "dist/src/worker"]

volumes:
  wallet_pgdata:
  wallet_rabbitmq:
